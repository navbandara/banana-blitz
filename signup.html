<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Banana Blitz</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg">
  <!-- Main layout container for the page content. -->
  <div class="page">

    <!-- Navigates the user back to the home page. -->
    <button class="backBtn" onclick="location.href='index.html'">←</button>

    <!-- Displays the compact version of the logo and title. -->
    <header class="topBrand small">
      <img class="logo smallLogo" src="assets/img/logo.png" alt="Logo">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Create a free account</p>
    </header>

    <!-- Form container for taking new user information. -->
    <main class="card formCard">
      <label class="label">Username</label>
      <input class="input" id="username" type="text" placeholder="Your name" />

      <label class="label">Email</label>
      <input class="input" id="email" type="email" placeholder="your@email.com" />

      <label class="label">Password</label>
      <input class="input" id="password" type="password" placeholder="••••••••" />

      <label class="label">Confirm Password</label>
      <input class="input" id="confirmPassword" type="password" placeholder="••••••••" />

      <button class="btn btn-orange full" id="signupBtn">Sign Up</button>

      <p class="smallText">
        Already have an account? <a href="login.html">Login</a>
      </p>

      <!-- Container for displaying authentication error messages to the user. -->
      <p class="msg" id="message"></p>
    </main>
  </div>

  <script type="module" src="auth.js"></script>

  <script type="module" src="mute.js"></script>
  <script src="meal.js"></script>
</body>

</html>

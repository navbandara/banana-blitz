<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game - Banana Blitz</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="bg">

<!-- Everything lives in here -->
<div class="page">

<!-- Go back arrow -->
<button class="backBtn" id="backBtn">←</button>


<!-- Top bar showing mode and timer -->
<header class="gameTop">

<div class="pill" id="modePill">
BANANA PUZZLE
</div>

<div class="timerPill">
⏱ <span id="timer">60</span>
</div>

</header>


<!-- The main game box -->
<main class="gameArea card">

<!-- The prompt at the top -->
<h2 class="h2 center" id="questionText">
Solve the Banana Puzzle
</h2>


<!-- The actual puzzle picture -->
<div class="puzzleBox center">

<img 
id="bananaImage"
class="bananaImg"
src=""
alt="Banana Puzzle"
width="260">

</div>


<!-- The box where they type their answer -->
<div class="answerBox">

<input
class="input answerInput"
id="answerInput"
type="text"
maxlength="1"
placeholder="0"
readonly>

</div>


<!-- Virtual keypad gets injected here -->
<div class="keypad" id="keypad"></div>


<!-- The submit button -->
<button class="btn btn-green full" id="submitBtn">
Submit ✅
</button>


<!-- "Correct!" or "Wrong!" text goes here -->
<p class="msg center" id="feedback"></p>


</main>

</div>


<!-- Load up the game logic -->
<script type="module" src="game.js"></script>

</body>
</html>

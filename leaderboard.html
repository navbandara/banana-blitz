<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard - Banana Blitz</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg">
  <!-- Main layout container for the page content. -->
  <div class="page">
    
    <!-- Navigates the user back to the main menu. -->
    <button class="backBtn" onclick="location.href='menufile.html'">←</button>

    <!-- Displays the compact version of the logo and title. -->
    <header class="topBrand small">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Leaderboard</p>
    </header>

    <!-- Container presenting the list of highest-ranking players. -->
    <main class="card">
      
      <!-- Header row defining the data columns. -->
      <div class="tableHead">
        <span>Rank</span>
        <span>Player</span>
        <span>Score</span>
      </div>
      
      <!-- Container where retrieved leaderboard records are dynamically inserted. -->
      <div id="leaderboardList" class="tableBody"></div>
      
      <!-- Container for displaying status or error messages regarding data retrieval. -->
      <p class="msg center" id="lbMsg"></p>
    </main>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="leaderboard.js"></script>
<script type="module" src="mute.js"></script>
</body>
</html>

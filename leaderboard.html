<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard - Banana Blitz</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg">
  <!-- Everything lives in here -->
  <div class="page">
    
    <!-- Go back arrow -->
    <button class="backBtn" onclick="location.href='menufile.html'">←</button>

    <!-- The smaller logo & title up top -->
    <header class="topBrand small">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Leaderboard</p>
    </header>

    <!-- The main box showing the top scores -->
    <main class="card">
      
      <!-- The column headers -->
      <div class="tableHead">
        <span>Rank</span>
        <span>Player</span>
        <span>Score</span>
      </div>
      
      <!-- The actual rows get injected here -->
      <div id="leaderboardList" class="tableBody"></div>
      
      <!-- E.g. "Loading..." or error messages -->
      <p class="msg center" id="lbMsg"></p>
    </main>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="leaderboard.js"></script>
</body>
</html>

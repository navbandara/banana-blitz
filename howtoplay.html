<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>How To Play - Banana Blitz</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg">
  <!-- Everything lives in here -->
  <div class="page">
    
    <!-- Go back arrow -->
    <button class="backBtn" onclick="location.href='menufile.html'">←</button>

    <!-- The smaller logo & title up top -->
    <header class="topBrand small">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Instructions</p>
    </header>

    <!-- The main instructional box -->
    <main class="card">
      <h2 class="h2 center">Instructions</h2>

      <!-- The step-by-step guide -->
      <div class="steps">
        <div class="step">
          <div class="stepText">1) Enter a number between <b>0</b> to <b>9</b></div>
        </div> <br>

        <div class="step">
          <div class="stepText">2) Press the <b>Submit</b> button after entering the number</div>
        </div>
      </div>

      <!-- Buttons to go back or play -->
      <div class="rowBtns">
        <button class="btn btn-dark" onclick="location.href='menufile.html'">Back</button>
        <button class="btn btn-green" onclick="location.href='levels.html'">Play</button>
      </div>
    </main>
  </div>
</body>
</html>

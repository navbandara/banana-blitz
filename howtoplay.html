<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How To Play - Banana Blitz</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg">
  <!-- Main layout container for the page content. -->
  <div class="page">

    <!-- Navigates the user back to the main menu. -->
    <button class="backBtn" onclick="location.href='menufile.html'">←</button>

    <!-- Displays the compact version of the logo and title. -->
    <header class="topBrand small">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Instructions</p>
    </header>

    <!-- Container displaying the primary gameplay instructions. -->
    <main class="card">
      <h2 class="h2 center">Instructions</h2>

      <!-- Formatted list providing step-by-step guidance. -->
      <div class="steps">
        <div class="step">
          <div class="stepText">1) Enter a number between <b>0</b> to <b>9</b></div>
        </div> <br>

        <div class="step">
          <div class="stepText">2) Press the <b>Submit</b> button after entering the number</div>
        </div>
      </div>

      <!-- Navigation controls providing options to return or start playing. -->
      <div class="rowBtns">
        <button class="btn btn-dark" onclick="location.href='menufile.html'">Back</button>
        <button class="btn btn-green" onclick="location.href='levels.html'">Play</button>
      </div>
    </main>
  </div>
  <script type="module" src="mute.js"></script>
  <script src="meal.js"></script>
</body>

</html>

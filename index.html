<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Blitz</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="bg">

<!-- Everything lives inside here -->
<div class="page">

<!-- Top branding stuff (logo, title) -->
<header class="topBrand">
<img class="logo" src="assets/img/logo.png" alt="Banana Blitz Logo">

<h1 class="title">
BANANA <span>BLITZ</span>
</h1>

<p class="subtitle">
Find the Missing Number!
</p>
</header>

<!-- The big central box with the monkey and buttons -->
<main class="card centerCard">

<div class="heroRow">

<!-- Left side monkey -->
<img class="heroMonkey" src="assets/img/monkey.png" alt="Monkey">

<!-- The buttons to log in or sign up -->
<div class="heroButtons">

<button class="btn btn-yellow" id="goLogin">
Login
</button>

<button class="btn btn-orange" id="goSignup">
Sign Up
</button>

</div>

<!-- Right side banana -->
<img class="heroBanana" src="assets/img/banana.png" alt="Banana">

</div>

</main>

</div>


<script>

// -- sounds --

const sounds = {

click: new Audio("assets/sfx/click.wav"),
correct: new Audio("assets/sfx/correct.mp3"),
wrong: new Audio("assets/sfx/wrong.wav"),
timeup: new Audio("assets/sfx/timeup.wav")

};


// plays our sounds

function playSound(name){

const s = sounds[name];

if(!s){
console.warn("Sound not found:", name);
return;
}

s.currentTime = 0;

const promise = s.play();

if(promise !== undefined){
promise.catch(error => {
console.warn("Audio play failed:", error);
});
}

}


// -- button clicks --

const loginBtn = document.getElementById("goLogin");
const signupBtn = document.getElementById("goSignup");


loginBtn.addEventListener("click", () => {
  playSound("click");
  setTimeout(() => {
    location.href = "login.html";
  },150);
});

signupBtn.addEventListener("click", () => {
  playSound("click");
  setTimeout(() => {
    location.href = "signup.html";
  },150);
});

</script>

<script type="module">
  import { initBackgroundMusic } from "./sound.js";
  // The moment the user clicks anywhere on the index page, init the background music
  document.body.addEventListener("click", () => {
    initBackgroundMusic();
  }, { once: true });
</script>

</body>
</html>

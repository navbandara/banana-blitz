<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Levels - Banana Blitz</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body class="bg">

  <!-- Main layout container for the page content. -->
  <div class="page">

    <!-- Navigates the user back to the main menu. -->
    <button class="backBtn" onclick="location.href='menufile.html'">←</button>

    <!-- Displays the compact version of the logo and title. -->
    <header class="topBrand small">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Select your difficulty</p>
    </header>

    <!-- Grid layout containing the different difficulty selection cards. -->
    <main class="levelsGrid">

      <!-- Card for selecting the easy difficulty level. -->
      <div class="levelCard green">
        <h3>Easy</h3>
        <p>Time: <b>60s</b></p>
        <button class="btn btn-green full" data-level="easy">Start</button>
      </div>

      <div class="levelCard orange">
        <h3>Moderate</h3>
        <p>Time: <b>40s</b></p>
        <button class="btn btn-orange full" data-level="moderate">Start</button>
      </div>

      <div class="levelCard red">
        <h3>Hard</h3>
        <p>Time: <b>20s</b></p>
        <button class="btn btn-red full" data-level="hard">Start</button>
      </div>

    </main>

  </div>

  <!-- Script to save the selected difficulty level and redirect to the game. -->
  <script>
    const levelButtons = document.querySelectorAll("[data-level]");

    levelButtons.forEach(button => {
      button.addEventListener("click", () => {
        const level = button.dataset.level;

        // Saves the selected level to local storage.
        localStorage.setItem("selectedLevel", JSON.stringify(level));

        // Redirects the user to the active game page.
        window.location.href = "game.html";
      });
    });
  </script>

<script type="module" src="mute.js"></script>
</body>
</html>

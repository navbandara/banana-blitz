<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hard Mode - Banana Blitz</title>

<link rel="stylesheet" href="style.css">
</head>


<body class="bg">

<div class="page">

<button class="backBtn" id="backBtn">←</button>

<header class="topBrand small">

<img src="assets/img/logo.png" class="logo">

<h1 class="title">BANANA <span>BLITZ</span></h1>

<p class="subtitle">Hard Mode</p>

</header>



<header class="gameTop">

<div class="pill" id="modePill">
HARD MODE
</div>

<div class="timerPill">
⏱ <span id="timer">20</span>
</div>

</header>



<main class="card gameArea">

<h2 class="h2 center" id="questionText">
Loading question...
</h2>


<div class="answerBox">

<input
class="input answerInput"
id="answerInput"
type="text"
placeholder="0"
readonly
>

</div>



<div class="keypad" id="keypad"></div>


<button class="btn btn-green full" id="submitBtn">
Submit
</button>


<p class="msg center" id="feedback"></p>

</main>

</div>



<script type="module" src="game.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Score - Banana Blitz</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg">
  <!-- Main layout container for the page content. -->
  <div class="page">
    
    <!-- Navigates the user back to the main menu. -->
    <button class="backBtn" onclick="location.href='menufile.html'">←</button>

    <!-- Displays the compact version of the logo and title. -->
    <header class="topBrand small">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Your Score</p>
    </header>

    <!-- Container displaying the player's final performance results. -->
    <main class="card centerCard">
      <h2 class="h2">Final Score</h2>
      
      <!-- Prominently displays the total points earned during the game. -->
      <div class="bigScore" id="finalScore">0</div>

      <!-- Navigation options prompting the user's next action. -->
      <div class="rowBtns">
        <button class="btn btn-dark" onclick="location.href='menufile.html'">Back to Menu</button>
        <button class="btn btn-green" onclick="location.href='levels.html'">Play Again</button>
      </div>

      <p class="smallText">Your score is saved to the leaderboard.</p>
    </main>
  </div>

  <script type="module" src="app.js"></script>
<script type="module" src="mute.js"></script>
</body>
</html>

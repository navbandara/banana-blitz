<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Mode - Banana Blitz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg">

<!-- Main layout container for the page content. -->
<div class="page">

    <!-- Navigates the user back to the past page. -->
    <button class="backBtn" id="backBtn">←</button>

    <!-- Displays the compact version of the logo and title. -->
    <header class="topBrand small">
        <img src="assets/img/logo.png" class="logo">
        <h1 class="title">BANANA <span>BLITZ</span></h1>
        <p class="subtitle">Easy Mode</p>
    </header>

    <!-- Header displaying the active game mode and remaining time. -->
    <header class="gameTop">
        <div class="pill" id="modePill">
            EASY MODE
        </div>

        <div class="timerPill">
            ⏱ <span id="timer">60</span>
        </div>
    </header>

    <!-- Central card area containing the active gameplay elements. -->
    <main class="card gameArea">

        <!-- Header displaying the current question or loading status. -->
        <h2 class="h2 center" id="questionText">
            Loading question...
        </h2>

        <!-- Read-only input field displaying the currently typed answer. -->
        <div class="answerBox">
            <input 
                class="input answerInput" 
                id="answerInput" 
                type="text" 
                placeholder="0" 
                readonly
            >
        </div>

        <!-- Container where the numeric keypad buttons are dynamically inserted. -->
        <div class="keypad" id="keypad"></div>

        <button class="btn btn-green full" id="submitBtn">
            Submit
        </button>

        <!-- Field for displaying answer validation feedback to the user. -->
        <p class="msg center" id="feedback"></p>

    </main>

</div>

<script type="module" src="game.js"></script>

<script type="module" src="mute.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu - Banana Blitz</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg">
  <!-- Main layout container for the page content. -->
  <div class="page">

    <!-- Navigates the user back to the previous page. -->
    <button class="backBtn" id="backBtn">←</button>

    <!-- Displays the currently logged-in user's information and logout option. -->
    <header class="topBar">
      <div class="userBox">
        <!-- Displays the current user's display name or email. -->
        <span id="userName">Player</span>
        <!-- Signs the user out of the application upon being clicked. -->
        <button class="btn btn-dark smallBtn" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- Displays the compact version of the project title. -->
    <header class="topBrand small">
      <h1 class="title">BANANA <span>BLITZ</span></h1>
      <p class="subtitle">Main Menu</p>
    </header>

    <!-- Central card containing the primary navigation options for the game. -->
    <main class="card centerCard">
      <button class="btn btn-orange full" onclick="location.href='levels.html'">Play</button>
      <button class="btn btn-blue full" onclick="location.href='howtoplay.html'">Instructions</button>
      <button class="btn btn-green full" onclick="location.href='leaderboard.html'">Leaderboard</button>
      <button class="btn btn-yellow full" onclick="location.href='score.html'">My Score</button>
    </main>

    <div class="bottomDecor">
    </div>
  </div>
  <script type="module" src="app.js"></script>
  <script type="module" src="mute.js"></script>
  <script src="meal.js"></script>
</body>

</html>
